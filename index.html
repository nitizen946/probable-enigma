<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDoアプリ</title>
<style>
  /* ===== 見た目(CSS) ===== */
  body {
    font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px;
    color: #222;
    background: #fff;
    line-height: 1.6;
  }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
  #task-input {
    flex: 1;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #888;
    border-radius: 4px;
  }
  button {
    padding: 10px 14px;
    font-size: 1rem;
    border: 1px solid #555;
    border-radius: 4px;
    background: #f2f2f2;
    cursor: pointer;
  }
  button:hover { background: #e4e4e4; }
  input:focus-visible, button:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
  }
  li span { flex: 1; word-break: break-all; }
  li.done span { text-decoration: line-through; color: #777; }
  #empty { color: #555; }
  #count { margin-top: 12px; color: #555; }
</style>
</head>
<body>

<h1>ToDoアプリ</h1>

<!-- ===== 画面の部品(HTML) ===== -->
<div class="input-row">
  <input id="task-input" type="text" placeholder="やることを入力" aria-label="やること">
  <button id="add-button" type="button">追加</button>
</div>

<ul id="task-list"></ul>
<p id="empty">まだやることがありません。上の欄に入力して追加しましょう。</p>
<p id="count"></p>

<script>
  // ===== 動き(JavaScript) =====
  // tasks: やることの一覧。[{ text: "宿題", done: false }, ...] の形で持つ
  var tasks = [];

  // ブラウザに保存してあるデータを読み込む(失敗しても動くようにする)
  try {
    var saved = localStorage.getItem("todo-tasks");
    if (saved) { tasks = JSON.parse(saved); }
  } catch (e) { tasks = []; }

  // データをブラウザに保存する
  function save() {
    try { localStorage.setItem("todo-tasks", JSON.stringify(tasks)); } catch (e) {}
  }

  // 画面を作り直す
  function render() {
    var list = document.getElementById("task-list");
    list.innerHTML = "";

    tasks.forEach(function (task, index) {
      var li = document.createElement("li");
      if (task.done) { li.className = "done"; }

      var check = document.createElement("input");
      check.type = "checkbox";
      check.checked = task.done;
      check.setAttribute("aria-label", "完了にする");
      check.addEventListener("change", function () {
        tasks[index].done = check.checked;
        save();
        render();
      });

      var text = document.createElement("span");
      text.textContent = task.text;

      var del = document.createElement("button");
      del.type = "button";
      del.textContent = "削除";
      del.addEventListener("click", function () {
        tasks.splice(index, 1);
        save();
        render();
      });

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(del);
      list.appendChild(li);
    });

    document.getElementById("empty").style.display = tasks.length === 0 ? "block" : "none";

    var remaining = tasks.filter(function (t) { return !t.done; }).length;
    document.getElementById("count").textContent =
      tasks.length === 0 ? "" : "残り " + remaining + " 件(全部で " + tasks.length + " 件)";
  }

  // やることを追加する
  function addTask() {
    var input = document.getElementById("task-input");
    var value = input.value.trim();
    if (value === "") { return; }
    tasks.push({ text: value, done: false });
    input.value = "";
    save();
    render();
    input.focus();
  }

  document.getElementById("add-button").addEventListener("click", addTask);
  document.getElementById("task-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { addTask(); }
  });

  render();
</script>
</body>
</html>
